services:
  n8n:
    image: ghcr.io/n8n-io/n8n:2.40.7
    pull_policy: missing
    restart: unless-stopped

    user: "1000:1000"

    environment:
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE:-Europe/Moscow}"
      TZ: "${TZ:-Europe/Moscow}"

      # Execution data cleanup
      EXECUTION_MODE: "regular"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "all"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_HARD_DELETE_BUFFER: "1"
      EXECUTIONS_DATA_PRUNE_SOFT_DELETE_INTERVAL: "60"
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: "15"

      # basic settings
      N8N_HOST: "${N8N_HOST}"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-https}"
      N8N_EDITOR_BASE_URL: "${N8N_EDITOR_BASE_URL}"
      N8N_WEBHOOK_URL: "${WEBHOOK_URL}"
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-true}"
      N8N_PROXY_HOPS: "${N8N_PROXY_HOPS:-2}"
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      N8N_PORT: "5678"

      # security/permissions
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"

      # task runners
      N8N_RUNNERS_MODE: "external"
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_RUNNERS_BROKER_PORT: "5679"

      # graceful shutdown
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: "30"

      # database
      DB_TYPE: "sqlite"
      DB_SQLITE_POOL_SIZE: "2"

      # tokens
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
    ports:
      - "5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 512M
        limits:
          cpus: "1.0"
          memory: 2G

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:5678/healthz/readiness"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  runner:
    image: ghcr.io/n8n-io/runners:2.40.7
    pull_policy: missing
    restart: unless-stopped

    user: "1000:1000"

    environment:
      # In Kubernetes these 127.0.0.1 because both containers
      # belonged to the same Pod.
      #
      # In Compose, use the n8n service name.
      N8N_RUNNERS_TASK_BROKER_URI: "http://n8n:5679"
      N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT: "5680"

      # tokens
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"
    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 256M
        limits:
          cpus: "1.0"
          memory: 1G

    depends_on:
      n8n:
        condition: service_healthy

volumes:
  n8n_data:
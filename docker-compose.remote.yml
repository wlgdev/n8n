services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.40.5}
    pull_policy: missing
    restart: unless-stopped

    user: "1000:1000"

    environment:
      # Timezone
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE:-Europe/Moscow}"
      TZ: "${TZ:-Europe/Moscow}"

      # Execution data cleanup
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
      EXECUTION_MODE: "regular"

      # n8n
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HOST: "${N8N_HOST}"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-https}"
      N8N_EDITOR_BASE_URL: "${N8N_EDITOR_BASE_URL}"
      WEBHOOK_URL: "${WEBHOOK_URL}"
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-true}"
      N8N_PROXY_HOPS: "${N8N_PROXY_HOPS:-2}"

      N8N_LISTEN_ADDRESS: "0.0.0.0"
      N8N_PORT: "5678"

      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: "30"

      # Task runners
      #
      # N8N_RUNNERS_ENABLED is deprecated in newer n8n versions,
      # so N8N_RUNNERS_MODE=external is the important setting.
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: "external"
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"

      # IMPORTANT:
      # runner is a separate Compose container, therefore the broker
      # cannot listen only on 127.0.0.1.
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_RUNNERS_BROKER_PORT: "5679"

      # SQLite
      DB_TYPE: "sqlite"
      DB_SQLITE_POOL_SIZE: "2"

      # Encryption
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"

    ports:
      - "5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 512M
        limits:
          cpus: "1.0"
          memory: 2G

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:5678/healthz/readiness"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  runner:
    image: n8nio/runners:${N8N_VERSION:-2.40.5}
    pull_policy: missing
    restart: unless-stopped

    user: "1000:1000"

    environment:
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"

      # In Kubernetes these 127.0.0.1 because both containers
      # belonged to the same Pod.
      #
      # In Compose, use the n8n service name.
      N8N_RUNNERS_TASK_BROKER_URI: "http://n8n:5679"

      N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT: "5680"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 256M
        limits:
          cpus: "1.0"
          memory: 1G

    depends_on:
      n8n:
        condition: service_healthy

volumes:
  n8n_data: